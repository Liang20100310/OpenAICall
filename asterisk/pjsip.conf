; ============================================================================
; pjsip.conf — FPGA 电话中继 + AI 语音指挥系统
; ----------------------------------------------------------------------------
; 接口契约：docs/INTERFACE_SPEC.md §8
;   · 音频桥服务（上位机 Python，PJSUA2/aiosip）注册为分机 1001
;   · 桥服务 ↔ Asterisk 走 G.711 A-law（8 kHz，与 FPGA 侧一致，全链路免转码）
;   · 分机 2001/2002 为内网 SIP 话机示例
;   · 外线走 Twilio / Telnyx SIP 中继（模板见文末，codec 约束 G.711 alaw）
;
; 注意：
;   1. 所有 <...> 占位符必须替换为实际值；
;   2. 强密码 ≥ 16 位随机字符，1001/2001/2002/中继密码各不相同；
;   3. 全局 disallow=all + allow=alaw，避免转码引入延迟与失真。
; ============================================================================

[global]
user_agent              = fpga-relay-pbx
default_realm           = fpga-relay.local        ; 摘要鉴权域，改为你自己的域名
accept_multiple_sdp_formats = no
taskprocessor_overload_trigger = global
disable_tcp_switch      = no
timert1                 = 500                     ; T1 定时器 500 ms（内网低延迟）
timert2                 = 4000
timerb                  = 32000

; ----------------------------------------------------------------------------
; 传输层
; ----------------------------------------------------------------------------
[transport-udp]
type                    = transport
protocol                = udp
bind                    = 0.0.0.0:5060
; 生产环境建议同时启用 TLS（见 README 安全章节），SRTP 可选
; local_net               = 192.168.0.0/16         ; 局域网网段，用于 NAT 判定
; external_media_address  = <公网 IP 或域名>
; external_signaling_address = <公网 IP 或域名>

; [transport-tls]
; type                    = transport
; protocol                = tls
; bind                    = 0.0.0.0:5061
; method                  = tlsv1.2
; cert_file               = /etc/asterisk/keys/asterisk.pem
; priv_key_file           = /etc/asterisk/keys/asterisk.key
; ca_list_file            = /etc/asterisk/keys/ca.crt
; verify_server           = no

; ----------------------------------------------------------------------------
; 通用模板
; ----------------------------------------------------------------------------
[auth-userpass]
type                    = auth
auth_type               = userpass

[aor-single]
type                    = aor
max_contacts            = 1
remove_existing         = yes
qualify_frequency       = 30                       ; 每 30 s 发 OPTIONS 保活/探测

[endpoint-basic]
type                    = endpoint
transport               = transport-udp
disallow                = all
allow                   = alaw                     ; G.711 A-law 唯一允许，见接口规范 §1
context                 = internal                 ; 默认拨号上下文
direct_media            = no                       ; 强制经 Asterisk 媒体转发，便于录音/AI 介入
rtp_symmetric           = yes
rewrite_contact        = yes
force_rport             = yes
timers                  = yes
dtmf_mode               = rfc4733                  ; 优先 RFC2833/4733；如桥服务只收 INFO/带内，逐端点调整
trust_id_inbound        = yes
send_pai                = yes
t38_udptl               = no
; ---- 安全基线 ----
accept_multiple_sdp_formats = no
use_ptime               = no
rtp_timeout             = 60                       ; 60 s 无 RTP 断线
rtp_hold_timeout        = 0
named_call_event        = yes

; ============================================================================
; 1001 — FPGA 音频桥服务（上位机 SIP UA）
; ============================================================================
[1001-auth]
type                    = auth
auth_type               = userpass
username                = 1001
password                = <强密码-至少16位-仅限桥服务使用>
realm                   = fpga-relay.local

[1001-aor]
type                    = aor
max_contacts            = 1                        ; 只允许一个桥服务实例在线
remove_existing         = yes
qualify_frequency       = 10                       ; 桥服务为系统核心，10 s 快速探测

[1001]
type                    = endpoint
transport               = transport-udp
auth                    = 1001-auth
aors                    = 1001-aor
context                 = internal
disallow                = all
allow                   = alaw
direct_media            = no
rtp_symmetric           = yes
rewrite_contact        = yes
force_rport             = yes
dtmf_mode               = rfc4733                  ; AI 收号依赖带外 DTMF 事件
; 桥服务为 8 kHz G.711 单声道音频管道：
asymmetric_rtp_codec    = yes
use_avpf                = no
media_encryption        = no                       ; 内网；如走 TLS 可改 sdes
rtp_timeout            = 60
t38_udptl              = no
; 桥服务经常长时间保持通话做 AI 对话：
rtp_keepalive           = 30
; 1001 拨入即进入 AI 分支由 dialplan 决定，端点本身不设特殊权限

; ============================================================================
; 2001 / 2002 — 内网 SIP 话机（示例，可按需增删）
; ============================================================================
[2001-auth]
type                    = auth
auth_type               = userpass
username                = 2001
password                = <强密码-2001专用>
realm                   = fpga-relay.local

[2001-aor]
type                    = aor
max_contacts            = 2                        ; 话机可能有线+WiFi 双注册
remove_existing         = yes
qualify_frequency       = 60

[2001]
type                    = endpoint
transport               = transport-udp
auth                    = 2001-auth
aors                    = 2001-aor
context                 = internal
disallow                = all
allow                   = alaw
direct_media            = no                       ; 若确无录音/AI 介入需求，可改 yes 走点对点
rtp_symmetric           = yes
rewrite_contact        = yes
force_rport             = yes
dtmf_mode               = rfc4733
mailbox                 = 2001@default            ; 可选语音信箱
call_group              = 1
pickup_group            = 1

[2002-auth]
type                    = auth
auth_type               = userpass
username                = 2002
password                = <强密码-2002专用>
realm                   = fpga-relay.local

[2002-aor]
type                    = aor
max_contacts            = 2
remove_existing         = yes
qualify_frequency       = 60

[2002]
type                    = endpoint
transport               = transport-udp
auth                    = 2002-auth
aors                    = 2002-aor
context                 = internal
disallow                = all
allow                   = alaw
direct_media            = no
rtp_symmetric           = yes
rewrite_contact        = yes
force_rport             = yes
dtmf_mode               = rfc4733
mailbox                 = 2002@default
call_group              = 1
pickup_group            = 1

; ---- 分机扩容说明（01XX 映射支持短号 01..10 → 分机 2001..2010）----
; 每个分机必须有完整三段：[NNNN-auth] + [NNNN-aor] + [NNNN]。
; 新增 2003..2010 时复制以下模板（改 NNNN 与密码）即可；
; 或用 #include 分片：把每台话机配置放 pjsip.d/2003.conf 再 include。
;
; [2003-auth]
; type                    = auth
; auth_type               = userpass
; username                = 2003
; password                = <强密码-2003专用>
; realm                   = fpga-relay.local
;
; [2003-aor]
; type                    = aor
; max_contacts            = 2
; remove_existing         = yes
; qualify_frequency       = 60
;
; [2003]
; type                    = endpoint
; transport               = transport-udp
; auth                    = 2003-auth
; aors                    = 2003-aor
; context                 = internal
; disallow                = all
; allow                   = alaw
; direct_media            = no
; rtp_symmetric           = yes
; rewrite_contact        = yes
; force_rport             = yes
; dtmf_mode               = rfc4733
; call_group              = 1
; pickup_group            = 1

; ============================================================================
; 外线 SIP 中继 — Twilio Elastic SIP Trunking（模板）
; 说明：
;   · <account> 为 Twilio 域名前缀，如 example.pstn.twilio.com
;   · 二选一鉴权：A. 凭据（用户名/密码）注册；B. IP ACL（静态 IP 认证，无需注册）
;   · codec 强约束 alaw，禁止 729/722 等，避免转码
; ============================================================================
[twilio-trunk]
type                    = endpoint
transport               = transport-udp
aors                    = twilio-aor               ; 出局呼叫路由到此 AOR 的 contact
context                 = from-trunk              ; 来电统一进 from-trunk 上下文
disallow                = all
allow                   = alaw
direct_media            = no
rtp_symmetric           = yes
force_rport             = yes
rewrite_contact        = yes
timers                  = yes
dtmf_mode               = rfc4733                  ; Twilio 侧务必确认启用 RFC2833
send_pai                = yes
trust_id_inbound        = yes                      ; 透传主叫号码
t38_udptl               = no
rtp_timeout            = 60
from_domain             = <account>.pstn.twilio.com
from_user               = <中继主叫号码或E.164>
; ---- A. 凭据鉴权（registration）----
[twilio-aor]
type                    = aor
contact                 = sip:<account>.pstn.twilio.com:5060
qualify_frequency       = 60
maximum_expiration      = 3600
minimum_expiration      = 60
default_expiration      = 600

[twilio-auth]
type                    = auth
auth_type               = userpass
username                = <twilio-credential-sid-username>
password                = <twilio-credential-secret>
realm                   = <account>.pstn.twilio.com

[twilio-registration]
type                    = registration
transport               = transport-udp
outbound_auth           = twilio-auth
server_uri              = sip:<account>.pstn.twilio.com
client_uri              = sip:<twilio-username>@<account>.pstn.twilio.com
retry_interval          = 20
forbidden_retry_interval = 30
fatal_retry_interval    = 300
max_retries             = 10
expiration              = 600
line                    = yes
endpoint                = twilio-trunk

; ---- B. IP ACL 认证（若 Twilio 侧启用静态 IP / 凭据改为 IP 认证，启用以下识别段）----
; [twilio-identify]
; type                    = identify
; endpoint                = twilio-trunk
; match                   = 54.172.60.0/24,54.172.61.0/24,54.172.62.0/24
;                         ; ↑ 示例网段，务必以 Twilio 官方 "SIP Trunking - IP Addresses"
;                         ;   文档为准，并随官方更新维护

; ============================================================================
; 外线 SIP 中继 — Telnyx（模板，替换 Twilio 时启用，并在 extensions.conf 切换）
; ============================================================================
; [telnyx-trunk]
; type                    = endpoint
; transport               = transport-udp
; aors                    = telnyx-aor
; context                 = from-trunk
; disallow                = all
; allow                   = alaw
; direct_media            = no
; rtp_symmetric           = yes
; force_rport             = yes
; rewrite_contact        = yes
; dtmf_mode               = rfc4733
; send_pai                = yes
; from_user               = <telnyx-outbound-number>
; from_domain             = sip.telnyx.com
;
; [telnyx-aor]
; type                    = aor
; contact                 = sip:sip.telnyx.com:5060
; qualify_frequency       = 60
;
; [telnyx-auth]
; type                    = auth
; auth_type               = userpass
; username                = <telnyx-connection-username>
; password                = <telnyx-connection-password>
;
; [telnyx-registration]
; type                    = registration
; outbound_auth           = telnyx-auth
; server_uri              = sip:sip.telnyx.com
; client_uri              = sip:<telnyx-username>@sip.telnyx.com
; retry_interval          = 20
; expiration              = 600
; endpoint                = telnyx-trunk

; ============================================================================
; 安全：匿名呼叫防护（配合 extensions.conf [public] 与 fail2ban，见 README）
; ============================================================================
; 原则：
;   1. 不定义任何 username=空/无 auth 的端点 —— PJSIP 默认拒绝未鉴权端点；
;   2. 所有端点 context 只指向 internal / from-trunk，不给 public；
;   3. 若必须开公网 5060，在防火墙限速 + fail2ban 封锁扫描器（见 README §安全）。
