; ============================================================================
; extensions.conf — FPGA 电话中继 + AI 语音指挥系统
; ----------------------------------------------------------------------------
; 拨号规则（与 docs/INTERFACE_SPEC.md §8 一致）：
;   00        → AI 语音管道（AGI 应答并接管媒体；AGI 内可再配合 ARI）
;   01 + XX   → 内网 SIP 分机（示例 2001/2002，Dial(PJSIP/...)）
;   02 + 号码 → 外线 SIP 中继（Twilio/Telnyx）
;   * 号码    → 内网分机直拨（话机习惯用法，可选）
; 语音全链路 G.711 A-law 8 kHz，勿在中途引入转码应用。
; ============================================================================

[general]
static = yes
writeprotect = no
clearglobalvars = no
priorityjumping = no

; ----------------------------------------------------------------------------
; 内部用户主上下文：1001（FPGA 桥）/ 2001 / 2002 的默认 context
; ----------------------------------------------------------------------------
[internal]
include => ai-pipeline          ; 00
include => ext-local            ; 01XX / 2XXX / 特服
include => ext-external         ; 02X.
include => services             ; *xx 特服

; —— 00：AI 语音管道 ————————————————————————————————————————
[ai-pipeline]
exten => 00,1,NoOp(AI voice pipeline: caller ${CALLERID(num)} ch ${CHANNEL})
 same => n,Set(CHANNEL(language)=zh)            ; 提示音/录音语言
 same => n,Answer()
 same => n,Wait(0.3)                             ; 等待媒体协商稳定（300 ms）
 same => n,Set(AI_SESSION_ID=${UNIQUEID})       ; AI 会话 ID = Asterisk UniqueID
 same => n,AGI(agi_ai_route.py)                 ; AGI 应答后接管放音/收号/挂断流程
 ; AGI 返回后若设置了 AI_TRANSFER，由 AGI 内部或此处继续转接：
 same => n,GotoIf($["${AI_TRANSFER}" != ""]?do-transfer)
 same => n,Hangup()
 same => n(do-transfer),NoOp(AI requested transfer to ${AI_TRANSFER})
 same => n,Dial(PJSIP/${AI_TRANSFER},30,T)
 same => n,Hangup()

; —— 01 + 2 位短号：内网 SIP 分机（MATH 线性映射，支持 01→2001 … 10→2010）——
; 扩容：短号 01..NN → 分机 2001..20NN；新增分机需同步在 pjsip.conf 增加
; endpoint/auth/aor 三段（模板见 pjsip.conf §2001）。
[ext-local]
exten => _01XX,1,NoOp(Internal short code ${EXTEN:2} from ${CALLERID(num)})
 same => n,Set(SHORT=${FILTER(0-9,${EXTEN:2})})          ; 只留数字
 same => n,GotoIf($[${LEN(${SHORT})} != 2]?illegal)       ; 必须 2 位短号
 same => n,Set(N=${MATH(${SHORT},int)})                   ; 去前导零："01"→1、"10"→10
 same => n,GotoIf($[${N} < 1]?illegal)
 same => n,GotoIf($[${N} > 10]?illegal)                   ; 当前 10 个短号，扩容只改这里
 same => n,Set(EXT_TARGET=${MATH(2000 + ${N},int)})       ; → 2001..2010
 same => n,Set(CDR(userfield)=internal)
 same => n,Dial(PJSIP/${EXT_TARGET},30,TtU(PJSIP/${CALLERID(all)}))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(pbx-invalid)                 ; 或 custom：无应答/忙提示音
 same => n,Hangup()
 same => n(done),Hangup()
 same => n(illegal),Playback(pbx-invalid)
 same => n,Hangup()

; 可选：话机直接拨 2001/2002（不经 01 前缀）
exten => _2XXX,1,NoOp(Direct ext ${EXTEN})
 same => n,Set(CDR(userfield)=internal-direct)
 same => n,Dial(PJSIP/${EXTEN},30,Tt)
 same => n,Hangup()

; 简单特服
exten => 1000,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
exten => 1002,1,Echo()                           ; 回声测试：验证 RTP 双向质量
 same => n,Hangup()
exten => 2000,1,VoicemailMain()                  ; 语音信箱主入口（可选）
 same => n,Hangup()

; —— 02 + 外线号码：SIP 中继 ————————————————————————————
[ext-external]
; 02 + 00 + 国家码/地区 + 号码（国际长途）：020013800138000 → 0013800138000
exten => _0200X.,1,NoOp(Intl call via trunk: ${EXTEN:2})
 same => n,GoTo(external-out,${EXTEN:2},1)
; 02 + 手机/固话（国内）：021380013800 → 1380013800
exten => _02X.,1,NoOp(Outbound via trunk: ${EXTEN:2})
 same => n,GoTo(external-out,${EXTEN:2},1)

[external-out]
; 号码规范化后从中继呼出。T = 允许被叫按 *1 转接；t = 主叫可转接；r = 回铃
exten => _X.,1,NoOp(Trunk dial ${EXTEN} from ${CALLERID(num)})
 same => n,Set(CDR(userfield)=trunk-out)
 same => n,Set(CALLERID(num)=${OUTCALLERID:-<中继主叫号码>})   ; 如运营商要求固定主叫
 ; Twilio 中继（默认）：
 same => n,Dial(PJSIP/${EXTEN}@twilio-trunk,60,Ttr)
 ; 如改用 Telnyx，把上行换成：
 ; same => n,Dial(PJSIP/${EXTEN}@telnyx-trunk,60,Ttr)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?end)
 same => n,Playback(all-circuits-busy-now)        ; 中继失败提示（或自定义音）
 same => n,Congestion()
 same => n(end),Hangup()

; ----------------------------------------------------------------------------
; 中继来电（Twilio/Telnyx → pjsip.conf context=from-trunk）
; ----------------------------------------------------------------------------
[from-trunk]
; 安全：不接受匿名/空主叫；按白名单路由
exten => _X.,1,NoOp(Inbound from trunk ${CHANNEL}: ${CALLERID(all)})
 same => n,GotoIf($["${CALLERID(num)}" = ""]?reject)
 same => n,Set(CDR(userfield)=trunk-in)
 ; 可选：按主叫号做黑白名单
 ; same => n,GotoIf($[${DB(blacklist/${CALLERID(num)})} = 1]?reject)
 ; 路由策略 A：直接进 AI 语音管道（机器人接线员）
 same => n,Goto(ai-pipeline,00,1)
 ; 路由策略 B：振铃分机，无应答再转 AI（取消注释并注释上面一行）
 ; same => n,Dial(PJSIP/2001&PJSIP/2002,20,tT)
 ; same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 ; same => n,Goto(ai-pipeline,00,1)
 ; same => n(done),Hangup()
 same => n(reject),NoOp(Reject anonymous/invalid inbound)
 same => n,Answer()
 same => n,Playback(pbx-invalid)
 same => n,Hangup()

; ----------------------------------------------------------------------------
; 兜底/拒接：任何未定义上下文的呼叫一律拒接（防匿名扫描）
; ----------------------------------------------------------------------------
[public]
exten => _X.,1,NoOp(Rejected unauthenticated call from ${CALLERID(all)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Hangup()

[services]
; * 号特服示例
exten => *69,1,Verbose(1,Last caller: ${CDR(lastapp)})   ; 回拨（简化示例）
 same => n,Hangup()
exten => *43,1,Echo()
 same => n,Hangup()
