; ============================================================================
; modules.conf — 示例（Asterisk 18/20 LTS）
; 原则：最小化加载面，只启用 PJSIP + AGI/ARI + 必要编解码，禁用不用的通道驱动
; ============================================================================

[modules]
autoload = no                ; 显式加载，减少攻击面（也可用 yes + noload 清单，二选一）

; ---- 核心 ----
load => res_adsi.so
load => res_agi.so           ; AGI（agi_ai_route.py 依赖）
load => res_ari.so           ; ARI（AI 管道接管媒体时使用，可选但推荐）
load => res_http_media_cache.so
load => res_http_websocket.so ; ARI over WebSocket 依赖
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_pubsub.so
load => res_pjsip_outbound_registration.so  ; Twilio/Telnyx 注册
load => res_pjsip_exten_state.so
load => res_pjsip_pidf_dialog_info_supplement.so
load => res_pjsip_header_funcs.so
load => res_rtp_asterisk.so
load => res_timing_timerfd.so
load => res_sorcery_astdb.so
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_realtime.so
load => res_stasis.so        ; ARI 应用框架
load => res_stasis_answer.so
load => res_stasis_playback.so
load => res_stasis_recording.so
load => res_stasis_snoop.so  ; AI 旁路监听/注入媒体（可选）
load => res_musiconhold.so
load => res_parking.so

; ---- 拨号计划 / 应用 ----
load => app_dial.so
load => app_playback.so      ; Playback
load => app_read.so          ; Read / 收号
load => app_stream_echo.so   ; 可选
load => app_verbose.so
load => app_macro.so
load => app_goto.so
load => app_stack.so
load => app_system.so        ; 谨慎：如不需要 system() 建议注释掉
load => app_transfer.so
load => app_record.so        ; 录音（可选）
load => app_ivrdemo.so       ; 可选
load => app_dumpchan.so      ; 调试用，可注释

; ---- 编解码：只保留 G.711 A-law（与 FPGA/桥服务一致）----
; ulaw 可留作互通兜底，但 pjsip.conf 各端点 allow=alaw 已禁止协商 ulaw
load => codec_alaw.so
load => codec_ulaw.so
; load => codec_gsm.so       ; 不需要，禁止加载
; load => codec_g722.so      ; 不需要（宽带与 8 kHz 管道不匹配）

; ---- 格式 ----
load => format_pcm.so        ; 提示音 WAV(PCM alaw/ulaw) 播放
load => format_wav.so
load => format_sln.so        ; 8 kHz raw，AI 管道 TTS 输出常用
load => format_gsm.so        ; 如提示音存 GSM（可选）

; ---- 其他 ----
load => func_callerid.so
load => func_strings.so
load => func_channel.so
load => func_dialplan.so
load => func_env.so          ; AGI 环境（可选）
load => func_logic.so
load => func_math.so
load => func_db.so
load => pbx_config.so        ; extensions.conf 解析
load => res_curl.so          ; AGI 脚本如改走 HTTP 本地 curl 校验（可选）

; ---- 明确不需要的通道驱动（保持卸载）----
; noload => chan_sip.so      ; 旧 SIP 栈，已由 PJSIP 取代
; noload => chan_iax2.so
; noload => chan_pjsip_debug? （不存在，占位防误加）
; noload => chan_dahdi.so    ; 无板卡
; noload => chan_unistim.so
; noload => chan_skinny.so
; noload => chan_mgcp.so
; noload => res_hep.so
; noload => res_snmp.so      ; 如需监控可启用并加 ACL

; ---- 实时（可选，不用可整体注释）----
; load => res_odbc.so
; load => res_config_odbc.so
; load => cdr_adaptive_odbc.so

load => cdr_manager.so       ; 通话记录（建议开）
load => cdr_csv.so
load => cdr.so
load => cel_manager.so       ; 事件明细，便于 AI 计费/审计（可选）
