; ============================================================================
; Asterisk PJSIP 配置（源代码）—— FPGA 电话中继 + AI 语音指挥系统
; 对应 INTERFACE_SPEC.md §8：上位机 UA = 1001，软电话 = 1002，SIP 中继 = trunk
; 部署：/etc/asterisk/pjsip.conf（或 include 进现有配置）
; 验证：asterisk -rx "pjsip reload" && asterisk -rx "pjsip show endpoints"
; ============================================================================

; ---- 传输层（内网 UDP；如需 TLS 另配）----
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ---- 上位机音频桥 UA（host/ 桥服务注册为 1001）----
[1001]
type = endpoint
context = ai-relay                 ; 拨号计划入口
disallow = all
allow = alaw                       ; G.711 A-law：与 FPGA 串口链路一致，全程免转码
dtmf_mode = rfc2833                ; DTMF 走 RFC2833 事件 → 上位机 DTMF 路由
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no
language = zh

[1001-auth]
type = auth
auth_type = userpass
password = ***      ; ★ 生产环境改强密码
username = 1001

[1001-aor]
type = aor
max_contacts = 1

; ---- 内网软电话分机（测试用 Linphone/Zoiper 注册 1002）----
[1002]
type = endpoint
context = ai-relay
disallow = all
allow = alaw
dtmf_mode = rfc2833
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no
language = zh

[1002-auth]
type = auth
auth_type = userpass
password = ***
username = 1002

[1002-aor]
type = aor
max_contacts = 1

; ---- SIP 中继（外线 02X. 出局；按运营商/云通信商参数填写）----
[trunk-out]
type = endpoint
context = ai-relay
disallow = all
allow = alaw
dtmf_mode = rfc2833
from_user = ***      ; 主叫号/账号
from_domain = sip.provider.example
direct_media = no

[trunk-out-auth]
type = auth
auth_type = userpass
username = ***
password = ***
realm = sip.provider.example

[trunk-out-aor]
type = aor
contact = sip:sip.provider.example:5060
qualify_frequency = 60

[trunk-out-registration]
type = registration
transport = transport-udp
outbound_auth = trunk-out-auth
server_uri = sip:sip.provider.example:5060
client_uri = sip:***@sip.provider.example
retry_interval = 30
