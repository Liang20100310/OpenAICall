; ============================================================================
; Asterisk 拨号计划（源代码）—— 三条路由（INTERFACE_SPEC.md §8）
;   00    → AI 语音管道（AGI 应答后接管媒体；正式版用 ARI externalMedia）
;   01XX  → 内网 SIP 分机（示例：01 + 2 位分机 → PJSIP/10XX，如 0102 → 1002）
;   02X.  → 外线经 SIP 中继（剥 "02" 前缀后出局）
; 部署：/etc/asterisk/extensions.conf 的 [ai-relay] 段
; 验证：asterisk -rx "dialplan reload" && asterisk -rx "dialplan show ai-relay"
; ============================================================================

[ai-relay]

; ---- 路由 1：00 → AI 语音管道 ----
; AGI 应答并播放测试提示音（ai_relay_agi_mock.py）；
; 正式版：改用 ARI channels/externalMedia 把 RTP 接到上位机 ai_pipeline
exten => 00,1,NoOp(AI voice pipeline call from ${CALLERID(num)})
 same => n,Answer()
 same => n,AGI(ai_relay_agi_mock.py)          ; 放在 /var/lib/asterisk/agi-bin/
 same => n,Hangup()

; ---- 路由 2：01XX → 内网 SIP 分机 ----
; 拨 01 + 2 位分机号 → PJSIP/10XX（0102 → 1002）；4 位分机号可改 pattern _01XXX.
exten => _01XX,1,NoOp(Internal extension call ${EXTEN})
 same => n,Dial(PJSIP/1${EXTEN:2},30,Tt)      ; 30 s 振铃超时，T=被叫转接 t=主叫转接
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(vm-nobodyavail)           ; 失败分支提示音
 same => n,Hangup()
 same => n(done),Hangup()

; ---- 路由 3：02X. → 外线（SIP 中继）----
; 拨 02 + 外线号（至少 1 位）→ 剥前缀出局；最小 2 位、最长 15 位由 pattern 约束
exten => _02X.,1,NoOp(Outbound via trunk: ${EXTEN:2})
 same => n,Dial(PJSIP/${EXTEN:2}@trunk-out,60,Tt)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Congestion()                       ; 中继不可达/被叫忙 → 拥塞音
 same => n,Hangup()
 same => n(done),Hangup()

; ---- 安全兜底：其他号码拒绝 ----
exten => _X.,1,Answer()
 same => n,Playback(invalid)                  ; 空号/非法前缀
 same => n,Hangup()
